general:
  time_step: 30
  gravity: 9.81
  h_conv_0: 4200.0
  refrigerant: "R134a"

# Coupled Optimization
correlations:
  frost_density_choice: "hayashi_1977"
  frost_conductivity_choice: "yonko_sepsy_1967"
  pressure_drop_choice: "Wang"
  h_conv_air_choice: "Wang"
  fan_choice: "OptiAbt"

correction_factors:
  h_conv_air: 1.19
  betta_intercept_air: 0.19 # For 7mm: 0.98
  betta_slope_air: 112.38
  surface_density: 1.02
  k_frost: 0.80
  frost_diffusion: 2.1
  pressure_loss: 0.74
  roughness_C: 18.63
  roughness_n: 2.62

geometry:
  # Discretization / Model Splits
  # These control how the global geometry is sliced for the model
  register_amount: 8.0 
  layer_amount: 6

  # Number of Fans of the Evaporator Unit
  fan_amount: 2
  
  # Global Physical Dimensions (The Real Machine)
  total_fin_height: 1.2    # [m] Total height before splitting by registers
  total_fin_length: 0.15   # [m] Total length before splitting by layers
  
  # Detailed Geometry
  fin_pitch: 0.007
  fin_thickness: 0.0002
  fin_amount: 71
  fin_thermal_conductivity: 200.0
  
  tube_outer_diameter: 0.012
  tube_inner_diameter: 0.0114
  tube_thermal_conductivity: 400.0
  
  # Tube Layout (Global counts)
  total_tube_layers: 6
  total_tubes_per_layer: 24